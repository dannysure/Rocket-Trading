services:
  db:
    image: postgres:15-alpine
    container_name: leap_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-team_rocket_db}
      POSTGRES_USER: ${DB_USER:-team_rocket_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-team_rocket_password123}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-team_rocket_admin} -d ${DB_NAME:-team_rocket_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leap_trading_app
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-team_rocket_db}
      - DB_USER=${DB_USER:-team_rocket_admin}
      - DB_PASSWORD=${DB_PASSWORD:-team_rocket_password123}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: