    InstrumentActivityListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/InstrumentActivityResponse'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    ClientSegmentActivityListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/ClientSegmentActivityResponse'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    SubmitPerpOrderRequest:
      type: object
      required: [symbol, side, size, leverage]
      properties:
        symbol: {type: string, maxLength: 20, example: BTC-PERP}
        side: {type: string, enum: [BUY, SELL], description: BUY longs, SELL shorts; trimmed and case-insensitive.}
        size:
          type: number
          minimum: 0.000001
          multipleOf: 0.000001
          description: Base-asset size. Reduce-only orders are capped at the open size.
        leverage: {type: integer, minimum: 1, maximum: 100, description: Also limited by the market's maxLeverage (409 when exceeded).}
        reduceOnly: {type: boolean, default: false}
    PerpMarketResponse:
      type: object
      required: [symbol, baseAsset, underlyingSymbol, quoteCurrency, maxLeverage, takerFeeRate, maintenanceMarginRate]
      properties:
        symbol: {type: string, example: BTC-PERP}
        baseAsset: {type: string, example: BTC}
        underlyingSymbol: {type: string, example: 'X:BTC-USD'}
        quoteCurrency: {type: string, example: USD}
        maxLeverage: {type: integer}
        takerFeeRate: {type: number, example: 0.00045}
        maintenanceMarginRate: {type: number, description: Half the initial margin at max leverage.}
    PerpTickerResponse:
      type: object
      required: [symbol, markPrice, oraclePrice, bid, ask, fundingRate, nextFundingAt, openInterest, maxLeverage, takerFeeRate, maintenanceMarginRate, capturedAt, delayed]
      properties:
        symbol: {type: string}
        markPrice: {type: number}
        oraclePrice: {type: number}
        bid: {type: number}
        ask: {type: number}
        fundingRate: {type: number, description: 'Hourly rate, capped at +/-4%. Positive means longs pay shorts.'}
        nextFundingAt: {type: string, format: date-time}
        openInterest: {type: number, description: Sum of open position sizes in the base asset.}
        maxLeverage: {type: integer}
        takerFeeRate: {type: number}
        maintenanceMarginRate: {type: number}
        capturedAt: {type: string, format: date-time}
        delayed: {type: boolean}
    PerpPositionResponse:
      type: object
      required: [positionId, symbol, side, size, entryPrice, margin, leverage, cumulativeFunding, openedAt]
      properties:
        positionId: {type: integer, format: int64}
        symbol: {type: string}
        side: {type: string, enum: [LONG, SHORT]}
        size: {type: number}
        entryPrice: {type: number}
        markPrice: {type: number, nullable: true}
        positionValue: {type: number, nullable: true}
        unrealizedPnl: {type: number, nullable: true}
        returnOnEquity: {type: number, nullable: true}
        liquidationPrice: {type: number, nullable: true, description: Null when no positive price can trigger liquidation.}
        margin: {type: number, description: Isolated margin after funding.}
        leverage: {type: integer}
        cumulativeFunding: {type: number, description: Positive means the position has paid funding overall.}
        openedAt: {type: string, format: date-time}
    PerpAccountResponse:
      type: object
      required: [accountId, currency, availableCollateral, totalMargin, unrealizedPnl, accountValue, positions]
      properties:
        accountId: {type: integer, format: int64}
        currency: {type: string}
        availableCollateral: {type: number, description: The DIRECT_TRADING cash balance.}
        totalMargin: {type: number}
        unrealizedPnl: {type: number}
        accountValue: {type: number}
        positions:
          type: array
          items: {$ref: '#/components/schemas/PerpPositionResponse'}
    PerpOrderResponse:
      type: object
      required: [orderId, symbol, side, kind, requestedSize, leverage, reduceOnly, status, fee, realizedPnl, submittedAt]
      properties:
        orderId: {type: integer, format: int64}
        symbol: {type: string}
        side: {type: string, enum: [BUY, SELL]}
        kind: {type: string, enum: [MARKET, LIQUIDATION]}
        requestedSize: {type: number}
        filledSize: {type: number, nullable: true}
        leverage: {type: integer}
        reduceOnly: {type: boolean}
        status: {type: string, enum: [FILLED, REJECTED]}
        fillPrice: {type: number, nullable: true}
        fee: {type: number}
        realizedPnl: {type: number, description: For liquidations, the forfeited isolated margin as a loss.}
        rejectionReason: {type: string, nullable: true}
        submittedAt: {type: string, format: date-time}
    PerpFundingResponse:
      type: object
      required: [fundingId, symbol, side, size, markPrice, fundingRate, payment, fundingTime]
      properties:
        fundingId: {type: integer, format: int64}
        symbol: {type: string}
        side: {type: string, enum: [LONG, SHORT]}
        size: {type: number}
        markPrice: {type: number}
        fundingRate: {type: number}
        payment: {type: number, description: Positive when the position paid, negative when it received.}
        fundingTime: {type: string, format: date-time}
    PerpMarketListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/PerpMarketResponse'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    PerpTickerEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/PerpTickerResponse'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    PerpAccountEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/PerpAccountResponse'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    PerpOrderEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/PerpOrderResponse'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    PerpOrderListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/PerpOrderResponse'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    PerpFundingListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/PerpFundingResponse'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
