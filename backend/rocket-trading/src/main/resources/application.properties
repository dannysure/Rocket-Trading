spring.application.name=rocket-trading
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8081}
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}

spring.datasource.url=${DB_URL:jdbc:h2:mem:rockettrading;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.sql.init.mode=always
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

mybatis.configuration.map-underscore-to-camel-case=true

security.jwt.secret=${JWT_SECRET:change-me-development-jwt-secret-1234567890}
security.jwt.issuer=${JWT_ISSUER:rocket-trading}
security.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}

quotes.fauxnance.base-url=${FAUXNANCE_BASE_URL:https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com}
quotes.fauxnance.api-key=${FAUXNANCE_API_KEY:}
quotes.fauxnance.stock-path=${FAUXNANCE_STOCK_PATH:${FAUXNANCE_QUOTE_PATH:/v1/quotes/{symbol}}}
quotes.fauxnance.crypto-path=${FAUXNANCE_CRYPTO_PATH:${FAUXNANCE_QUOTE_PATH:/v1/quotes/{symbol}}}
quotes.fauxnance.max-age-seconds=${FAUXNANCE_MAX_AGE_SECONDS:60}
