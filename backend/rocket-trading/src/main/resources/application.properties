spring.application.name=rocket-trading
spring.config.import=optional:file:../../.env[.properties],optional:file:.env[.properties]
server.port=${SERVER_PORT:8081}

# Database URL - Uses DB_PORT from .env (5432 for local, 5435 for Docker)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:team_rocket_db}}
spring.datasource.username=${DB_USERNAME:team_rocket_admin}
spring.datasource.password=${DB_PASSWORD:team_rocket_password123}
spring.sql.init.mode=never
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=true
# This branch can run against databases that contain reporting migrations from the split-db branch.
spring.flyway.ignore-migration-patterns=*:missing
spring.datasource.hikari.connection-timeout=10000
spring.jackson.time-zone=UTC
trading.worker.enabled=${TRADING_WORKER_ENABLED:true}
trading.worker.delay-ms=${TRADING_WORKER_DELAY_MS:1000}
# BR-06: an accepted order with no current market price (e.g. market closed) is retried, then expires
trading.deferral.retry-seconds=${TRADING_DEFERRAL_RETRY_SECONDS:300}
trading.deferral.max-hours=${TRADING_DEFERRAL_MAX_HOURS:96}
# BR-16: reporting reads a snapshot refreshed on its own schedule, off the trading path
reporting.refresh-ms=${REPORTING_REFRESH_MS:30000}
# Order execution and reporting refresh run on separate scheduler threads so neither waits on the other
spring.task.scheduling.pool.size=2
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
# Representative sign-in fixture (joanna@example.com, priya@rocket.internal, david@rocket.internal); unset = none created
fixtures.password=${FIXTURE_PASSWORD:}

mybatis.configuration.map-underscore-to-camel-case=true

security.jwt.secret=${JWT_SECRET:change-me-development-jwt-secret-1234567890}
security.jwt.issuer=${JWT_ISSUER:rocket-trading}
security.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}

quotes.fauxnance.base-url=${FAUXNANCE_BASE_URL:https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com}
quotes.fauxnance.api-key=${FAUXNANCE_API_KEY:}
quotes.fauxnance.stock-path=${FAUXNANCE_STOCK_PATH:${FAUXNANCE_QUOTE_PATH:/v1/quotes/{symbol}}}
quotes.fauxnance.crypto-path=${FAUXNANCE_CRYPTO_PATH:${FAUXNANCE_QUOTE_PATH:/v1/quotes/{symbol}}}
quotes.fauxnance.max-age-seconds=${FAUXNANCE_MAX_AGE_SECONDS:900}
# FX rates are daily closes; 4 days covers weekends and holidays
quotes.fauxnance.fx-max-age-seconds=${FAUXNANCE_FX_MAX_AGE_SECONDS:345600}
quotes.fauxnance.allow-stale=${FAUXNANCE_ALLOW_STALE:true}
# Optional Finnhub news integration; empty key leaves the UI in its empty state
news.finnhub.base-url=${NEWS_BASE_URL:https://finnhub.io/api/v1}
news.finnhub.api-key=${NEWS_API_KEY:}
news.finnhub.cache-seconds=${NEWS_CACHE_SECONDS:300}
news.finnhub.lookback-days=${NEWS_LOOKBACK_DAYS:7}
# Instrument details (name, type, currency, exchange) are re-read from Fauxnance at startup and on this interval
catalog.sync-ms=${CATALOG_SYNC_MS:21600000}

# ============================================================================
# OAUTH 2.0 CONFIGURATION
# ============================================================================
# Google OAuth 2.0
oauth.google.client-id=${OAUTH_GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET:}
oauth.google.redirect-uri=${OAUTH_GOOGLE_REDIRECT_URI:http://localhost:8081/login/oauth2/code/google}

# ============================================================================
# SECURITY CONFIGURATION
# ============================================================================
# OAuth 2.0 is configured via OAuthConfig bean which handles optional/empty credentials

# ============================================================================
# KAFKA CONFIGURATION
# ============================================================================
spring.kafka.enabled=${SPRING_KAFKA_ENABLED:true}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.properties.batch.size=16384
spring.kafka.consumer.group-id=rocket-trading-default
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.session.timeout.ms=30000
spring.kafka.consumer.properties.spring.json.trusted.packages=com.rockettrading.rocket_trading.dto.event
spring.kafka.listener.ack-mode=manual_immediate

# Orders topic configuration
kafka.topics.order-accepted=order.accepted
kafka.topics.order-filled=order.filled
kafka.topics.order-rejected=order.rejected

# ============================================================================
# REDIS CONFIGURATION
# ============================================================================
spring.redis.enabled=${SPRING_REDIS_ENABLED:true}
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=2000ms
spring.redis.database=0

# Redis cache defaults (in seconds)
redis.cache.order.ttl=30
redis.cache.refresh-token.ttl=604800
redis.cache.kpi.ttl=300
redis.rate-limit.orders-per-minute=100

