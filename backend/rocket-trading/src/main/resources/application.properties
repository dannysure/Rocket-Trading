spring.application.name=rocket-trading
spring.config.import=optional:file:../../.env[.properties],optional:file:.env[.properties]
server.port=${SERVER_PORT:8081}

# Database URL - Uses DB_PORT from .env (5432 for local, 5435 for Docker)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:team_rocket_db}}
spring.datasource.username=${DB_USERNAME:team_rocket_admin}
spring.datasource.password=${DB_PASSWORD:team_rocket_password123}
spring.sql.init.mode=never
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=true
spring.datasource.hikari.connection-timeout=10000
spring.jackson.time-zone=UTC
trading.worker.enabled=${TRADING_WORKER_ENABLED:true}
trading.worker.delay-ms=${TRADING_WORKER_DELAY_MS:1000}
# BR-06: an accepted order with no current market price (e.g. market closed) is retried, then expires
trading.deferral.retry-seconds=${TRADING_DEFERRAL_RETRY_SECONDS:300}
trading.deferral.max-hours=${TRADING_DEFERRAL_MAX_HOURS:96}
# BR-16: orders are copied to the reporting database on this schedule, off the trading path
reporting.refresh-ms=${REPORTING_REFRESH_MS:30000}
# BR-16: the reporting database. Unset = a separate schema and pool on the trading database (local development only)
reporting.datasource.url=${REPORTING_DB_URL:}
reporting.datasource.username=${REPORTING_DB_USERNAME:}
reporting.datasource.password=${REPORTING_DB_PASSWORD:}
reporting.datasource.max-pool-size=${REPORTING_DB_POOL_SIZE:4}
reporting.sync.settle-seconds=${REPORTING_SYNC_SETTLE_SECONDS:5}
# Order execution and reporting refresh run on separate scheduler threads so neither waits on the other
spring.task.scheduling.pool.size=2
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
# Representative sign-in fixture (joanna@example.com, priya@rocket.internal, david@rocket.internal); unset = none created
fixtures.password=${FIXTURE_PASSWORD:}

mybatis.configuration.map-underscore-to-camel-case=true

# No default: unset means a random key per run (see JwtService). Set it to share sessions across restarts and with the analytics API
security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=${JWT_ISSUER:rocket-trading}
security.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}

quotes.fauxnance.base-url=${FAUXNANCE_BASE_URL:https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com}
quotes.fauxnance.api-key=${FAUXNANCE_API_KEY:}
quotes.fauxnance.stock-path=${FAUXNANCE_STOCK_PATH:${FAUXNANCE_QUOTE_PATH:/v1/quotes/{symbol}}}
quotes.fauxnance.crypto-path=${FAUXNANCE_CRYPTO_PATH:${FAUXNANCE_QUOTE_PATH:/v1/quotes/{symbol}}}
quotes.fauxnance.max-age-seconds=${FAUXNANCE_MAX_AGE_SECONDS:900}
# FX rates are daily closes; 4 days covers weekends and holidays
quotes.fauxnance.fx-max-age-seconds=${FAUXNANCE_FX_MAX_AGE_SECONDS:345600}
quotes.fauxnance.allow-stale=${FAUXNANCE_ALLOW_STALE:true}
# Instrument details (name, type, currency, exchange) are re-read from Fauxnance at startup and on this interval
catalog.sync-ms=${CATALOG_SYNC_MS:21600000}

# Perpetual futures. The spot index streams from Coinbase Exchange public market data (no key or quota);
# Fauxnance is the fallback while the stream is down. Funding is charged on the hour (UTC) at a rate set by how
# far the perp trades from spot, which follows the long/short open-interest imbalance.
trading.perps.price-feed.enabled=${PERPS_PRICE_FEED_ENABLED:true}
trading.perps.price-feed.websocket-url=${PERPS_PRICE_FEED_WS_URL:wss://ws-feed.exchange.coinbase.com}
trading.perps.price-feed.rest-url=${PERPS_PRICE_FEED_REST_URL:https://api.exchange.coinbase.com}
trading.perps.stream-interval-ms=${PERPS_STREAM_INTERVAL_MS:500}

# ============================================================================
# OAUTH 2.0 CONFIGURATION
# ============================================================================
oauth.redirect-uri=${OAUTH_REDIRECT_URI:http://localhost:4200/auth/callback}

# GitHub OAuth 2.0
oauth.github.client-id=${OAUTH_GITHUB_CLIENT_ID:}
oauth.github.client-secret=${OAUTH_GITHUB_CLIENT_SECRET:}

# ============================================================================
# SECURITY CONFIGURATION
# ============================================================================
# OAuth 2.0 is configured via OAuthConfig bean which handles optional/empty credentials

# ============================================================================
# KAFKA CONFIGURATION
# ============================================================================
spring.kafka.enabled=${SPRING_KAFKA_ENABLED:true}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
# Kafka is optional (the worker polls the database): if the broker is down, give up on an event within
# a second instead of the default 60s, so order placement and settlement never stall on it (9.1/9.2)
spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.properties.batch.size=16384
spring.kafka.consumer.group-id=rocket-trading-default
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.session.timeout.ms=30000
spring.kafka.consumer.properties.spring.json.trusted.packages=com.rockettrading.rocket_trading.dto.event
spring.kafka.listener.ack-mode=manual_immediate

# Orders topic configuration
kafka.topics.order-accepted=order.accepted
kafka.topics.order-filled=order.filled
kafka.topics.order-rejected=order.rejected

# ============================================================================
# REDIS CONFIGURATION
# ============================================================================
spring.redis.enabled=${SPRING_REDIS_ENABLED:true}
# Spring Boot 3 reads spring.data.redis.*; the old spring.redis.* names were ignored, so the API never reached Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.database=0

# Redis cache defaults (in seconds)
redis.cache.order.ttl=30
redis.cache.refresh-token.ttl=604800
redis.cache.kpi.ttl=300
redis.rate-limit.orders-per-minute=100

