spring.application.name=rocket-trading
spring.config.import=optional:file:../../.env[.properties],optional:file:.env[.properties]
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/team_rocket_db}
spring.datasource.username=${DB_USERNAME:team_rocket_admin}
spring.datasource.password=${DB_PASSWORD:team_rocket_password123}
spring.sql.init.mode=never
spring.flyway.clean-disabled=true
spring.datasource.hikari.connection-timeout=10000
spring.jackson.time-zone=UTC
trading.worker.enabled=${TRADING_WORKER_ENABLED:true}
trading.worker.delay-ms=${TRADING_WORKER_DELAY_MS:1000}

mybatis.configuration.map-underscore-to-camel-case=true

security.jwt.secret=${JWT_SECRET:change-me-development-jwt-secret-1234567890}
security.jwt.issuer=${JWT_ISSUER:rocket-trading}
security.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}

quotes.fauxnance.base-url=${FAUXNANCE_BASE_URL:https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com}
quotes.fauxnance.api-key=${FAUXNANCE_API_KEY:}
quotes.fauxnance.stock-path=${FAUXNANCE_STOCK_PATH:${FAUXNANCE_QUOTE_PATH:/v1/quotes/{symbol}}}
quotes.fauxnance.crypto-path=${FAUXNANCE_CRYPTO_PATH:${FAUXNANCE_QUOTE_PATH:/v1/quotes/{symbol}}}
quotes.fauxnance.max-age-seconds=${FAUXNANCE_MAX_AGE_SECONDS:60}
