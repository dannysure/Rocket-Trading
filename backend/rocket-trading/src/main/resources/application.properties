spring.application.name=rocket-trading
spring.config.import=optional:file:../../.env[.properties],optional:file:.env[.properties]
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/team_rocket_db}
spring.datasource.username=${DB_USERNAME:team_rocket_admin}
spring.datasource.password=${DB_PASSWORD:team_rocket_password123}
spring.sql.init.mode=never
spring.flyway.clean-disabled=true
spring.datasource.hikari.connection-timeout=10000
spring.jackson.time-zone=UTC
trading.worker.enabled=${TRADING_WORKER_ENABLED:true}
trading.worker.delay-ms=${TRADING_WORKER_DELAY_MS:1000}

mybatis.configuration.map-underscore-to-camel-case=true

security.jwt.secret=${JWT_SECRET:change-me-development-jwt-secret-1234567890}
security.jwt.issuer=${JWT_ISSUER:rocket-trading}
security.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}

quotes.fauxnance.base-url=${FAUXNANCE_BASE_URL:https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com}
quotes.fauxnance.api-key=${FAUXNANCE_API_KEY:}
quotes.fauxnance.stock-path=${FAUXNANCE_STOCK_PATH:${FAUXNANCE_QUOTE_PATH:/v1/quotes/{symbol}}}
quotes.fauxnance.crypto-path=${FAUXNANCE_CRYPTO_PATH:${FAUXNANCE_QUOTE_PATH:/v1/quotes/{symbol}}}
quotes.fauxnance.max-age-seconds=${FAUXNANCE_MAX_AGE_SECONDS:60}

# ============================================================================
# KAFKA CONFIGURATION
# ============================================================================
kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.linger.ms=10

# ============================================================================
# WEBSOCKET CONFIGURATION (for real-time updates)
# ============================================================================
spring.websocket.enabled=true
spring.websocket.endpoint=/ws
spring.websocket.allowed-origins=*

# ============================================================================
# OAUTH 2.0 CONFIGURATION
# ============================================================================
oauth.redirect-uri=${OAUTH_REDIRECT_URI:http://localhost:4200/auth/callback}

# Google OAuth 2.0
oauth.google.client-id=${OAUTH_GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET:}

# GitHub OAuth 2.0
oauth.github.client-id=${OAUTH_GITHUB_CLIENT_ID:}
oauth.github.client-secret=${OAUTH_GITHUB_CLIENT_SECRET:}

# Microsoft/Azure AD OAuth 2.0
oauth.microsoft.client-id=${OAUTH_MICROSOFT_CLIENT_ID:}
oauth.microsoft.client-secret=${OAUTH_MICROSOFT_CLIENT_SECRET:}

# ============================================================================
# SECURITY CONFIGURATION
# ============================================================================
spring.security.oauth2.client.registration.google.client-id=${OAUTH_GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${oauth.redirect-uri}?provider=google

spring.security.oauth2.client.registration.github.client-id=${OAUTH_GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${OAUTH_GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri=${oauth.redirect-uri}?provider=github

spring.security.oauth2.client.registration.microsoft.client-id=${OAUTH_MICROSOFT_CLIENT_ID:}
spring.security.oauth2.client.registration.microsoft.client-secret=${OAUTH_MICROSOFT_CLIENT_SECRET:}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
spring.security.oauth2.client.registration.microsoft.redirect-uri=${oauth.redirect-uri}?provider=microsoft
