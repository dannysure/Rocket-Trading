services:
  postgres:
    image: 'postgres:15-alpine'
    container_name: rocket_trading_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-team_rocket_db}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-team_rocket_password123}
      POSTGRES_USER: ${DB_USERNAME:-team_rocket_admin}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-team_rocket_admin} -d ${DB_NAME:-team_rocket_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
