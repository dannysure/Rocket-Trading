name: Trading verification
on:
  push:
    branches: [develop, main, feature/db-backend-connection, feature/complete-oauth]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend unit tests
        working-directory: backend/rocket-trading
        run: ./mvnw -B -ntp test
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-results
          path: backend/rocket-trading/target/surefire-reports
          if-no-files-found: warn
